<script>
  // テーマ（light/dark）を描画前に決めてちらつきを防ぐ。保存した選択が無ければOSの設定に従う
  (function () {
    let t = null;
    try { t = localStorage.getItem('km_theme'); } catch (e) {}
    if (t !== 'light' && t !== 'dark')
      t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
    document.documentElement.dataset.theme = t;
  })();
</script>

/* YouTubeロゴは背景に合わせて白版/黒版を出し分ける（色の改変は禁止なので画像ごと切り替える） */
.yt-logo-on-light { display: none !important; }
:root[data-theme="light"] .yt-logo-on-dark  { display: none !important; }
:root[data-theme="light"] .yt-logo-on-light { display: block !important; }

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Hiragino Sans', 'Meiryo', sans-serif;
  min-height: 100vh;
}

/* ── Header ──────────────────────────────────────── */
.header {
  background: var(--bg-header);
  border-bottom: 1px solid var(--border);
  padding: 10px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  position: sticky;
  top: 0;
  z-index: 10;
}
.header-title { font-size: 13px; font-weight: bold; letter-spacing: 1px; color: var(--accent); white-space: nowrap; }
.header-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.last-updated { font-size: 11px; color: var(--text-secondary); margin-left: auto; white-space: nowrap; }

.btn {
  background: var(--btn-bg);
  border: 1px solid var(--border-control);
  border-radius: 5px;
  color: var(--btn-text);
  font-family: inherit;
  font-size: 11px;
  padding: 4px 10px;
  cursor: pointer;
  transition: all .15s;
  white-space: nowrap;
}
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn.primary { border-color: var(--accent-border); color: var(--accent); }
.btn.active  { border-color: var(--orange-border); color: var(--orange); }
.btn.danger { border-color: var(--err-border); color: var(--err); }
.btn.danger:hover { border-color: var(--err); }

/* ── Stats bar ────────────────────────────────────── */
.stats-bar {
  display: flex;
  gap: 16px;
  padding: 7px 16px;
  background: var(--bg-stats);
  border-bottom: 1px solid var(--border-subtle);
  font-size: 11px;
}
.stat-item { display: flex; align-items: center; gap: 5px; }
.stat-badge {
  display: inline-block;
  padding: 1px 7px;
  border-radius: 10px;
  font-size: 10px;
  font-weight: bold;
}
.stat-badge.approaching { background: var(--orange-bg); color: var(--orange); border: 1px solid var(--orange-line); }
.stat-badge.achieved    { background: var(--gold-bg); color: var(--gold); border: 1px solid var(--gold-line); }
.stat-label { color: var(--text-muted); }
.stat-count { color: var(--text); font-weight: bold; }

/* ── Card grid ────────────────────────────────────── */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 10px;
  padding: 12px;
}

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  overflow: hidden;
  position: relative;
  transition: border-color .2s, box-shadow .2s;
  text-decoration: none;
  color: inherit;
  display: block;
}
/* 外部チャンネル: 紫系。ステータスクラスとの組み合わせも明示定義 */
.card.external {
  border-color: var(--ext-border);
  background: linear-gradient(160deg, var(--ext-bg1) 0%, var(--ext-bg2) 60%);
  box-shadow: 0 0 14px var(--ext-glow);
}
.card.external.approaching {
  border: 2px solid var(--orange-border);
  background: linear-gradient(160deg, var(--ext-soon-bg1) 0%, var(--ext-soon-bg2) 60%);
  box-shadow: 0 0 18px var(--orange-glow);
}
.card.external.achieved {
  border: 2px solid var(--gold);
  background: linear-gradient(160deg, var(--ext-ach-bg1) 0%, var(--ext-ach-bg2) 55%);
  box-shadow: 0 0 28px var(--gold-glow), inset 0 0 24px var(--gold-inner);
}
.card.external.achieved-1d {
  border-color: var(--gold-dim);
  background: linear-gradient(160deg, var(--ext-ach1d-bg1) 0%, var(--ext-ach1d-bg2) 60%);
  box-shadow: 0 0 16px var(--gold-glow2);
}
.card.approaching {
  border: 2px solid var(--orange-border);
  box-shadow: 0 0 18px var(--orange-glow);
}
.card.achieved {
  border: 2px solid var(--gold);
  background: linear-gradient(160deg, var(--ach-bg1) 0%, var(--surface) 55%);
  box-shadow: 0 0 28px var(--gold-glow), inset 0 0 24px var(--gold-inner);
}
.card.achieved-1d {
  border-color: var(--gold-dim);
  box-shadow: 0 0 16px var(--gold-glow2);
}


/* ── セクションヘッダー ──────────────────────────── */
.section-header {
  grid-column: 1 / -1;
  font-size: 10px;
  letter-spacing: 2px;
  color: var(--text-muted);
  padding: 8px 4px 4px;
  border-bottom: 1px solid var(--border-section);
  margin-bottom: 2px;
}
.section-header:first-child { padding-top: 0; }

/* ── 島（到達が近い順の「節目達成」「もうすぐ到達」） ─────────── */
.island { margin: 12px 12px 4px; border-radius: 14px; padding: 12px 12px 2px; }
.island.soon     { background: linear-gradient(160deg, var(--island-soon-bg1) 0%, var(--island-soon-bg2) 70%); border: 1px solid var(--island-soon-line); }
.island.achieved { background: linear-gradient(160deg, var(--island-ach-bg1) 0%, var(--island-ach-bg2) 70%); border: 1px solid var(--island-ach-line); }
.island .grid { padding: 10px 0 12px; }
.island-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 8px; }
.island-eyebrow { font-size: 10px; font-weight: bold; letter-spacing: .15em; }
.island.soon .island-eyebrow     { color: var(--orange); }
.island.achieved .island-eyebrow { color: var(--gold); }
.island-title { font-size: 16px; font-weight: bold; color: var(--island-title); margin-top: 2px; }
.island-count { font-size: 12px; color: var(--island-sub); }

/* 島のカードの主役表示（到達予想・達成） */
.hero { border-radius: 8px; padding: 8px 10px; margin-bottom: 8px; }
.hero.soon     { background: var(--hero-soon-bg); border: 1px solid var(--hero-soon-line); }
.hero.achieved { background: var(--hero-ach-bg); border: 1px solid var(--hero-ach-line); }
.hero-label { font-size: 11px; color: var(--hero-label); }
.hero-main  { font-size: 24px; font-weight: bold; line-height: 1.25; font-variant-numeric: tabular-nums; }
.hero.soon .hero-main     { color: var(--hero-soon); }
.hero.achieved .hero-main { color: var(--gold); }
.hero-unit { font-size: 13px; margin-left: 3px; }
.hero-sub  { font-size: 11px; color: var(--island-sub); }
.views-row.compact .views-count { font-size: 17px; }
.eta-date { font-weight: normal; }

/* ── Toolbar (フィルタ・ソート) ────────────────────── */
.toolbar {
  display: flex;
  align-items: center;
  gap: 8px 16px;
  padding: 8px 12px;
  background: var(--bg-toolbar);
  border-bottom: 1px solid var(--border-subtle);
  flex-wrap: wrap;
}
.toolbar-row { display: flex; align-items: center; gap: 6px; }
.toolbar-label { font-size: 11px; color: var(--text-secondary); white-space: nowrap; }
.tbtn {
  background: var(--surface-sunken);
  border: 1px solid var(--border-control);
  border-radius: 6px;
  color: var(--tbtn-text);
  font-family: inherit;
  font-size: 12px;
  padding: 5px 11px;
  cursor: pointer;
  transition: all .15s;
  white-space: nowrap;
}
.tbtn:hover  { color: var(--tbtn-hover); }
.tbtn.active { background: var(--accent-bg); border-color: var(--accent-border-strong); color: var(--accent-text); }
/* 択一のボタン群は1つにつなげ、どれか1つを選ぶものだと分かるようにする */
.seg { display: inline-flex; border: 1px solid var(--border-control); border-radius: 6px; overflow: hidden; }
.seg .tbtn { border: none; border-radius: 0; }
.seg .tbtn + .tbtn { border-left: 1px solid var(--border-control); }
/* オン・オフの切り替え（★のみ） */
.tbtn.toggle.active { background: var(--gold-bg); border-color: var(--gold); color: var(--gold); }
.search-box {
  flex: 1;
  min-width: 160px;
  max-width: 280px;
  background: var(--input-bg);
  border: 1px solid var(--border-control);
  border-radius: 6px;
  color: var(--text);
  font-family: inherit;
  font-size: 13px;
  padding: 5px 10px;
}
.search-box:focus { outline: none; border-color: var(--accent); }
.empty-msg { grid-column: 1 / -1; text-align: center; padding: 40px 0; font-size: 12px; color: var(--text-secondary); }

.thumb-wrap { position: relative; cursor: pointer; }
.card-thumb {
  width: 100%;
  aspect-ratio: 16 / 9;
  object-fit: cover;
  display: block;
  background: var(--surface-sunken);
}
.thumb-duration {
  position: absolute;
  bottom: 4px;
  right: 4px;
  background: rgba(0,0,0,.85);
  color: #fff;
  font-size: 10px;
  font-weight: bold;
  padding: 1px 5px;
  border-radius: 2px;
  font-variant-numeric: tabular-nums;
  letter-spacing: .3px;
}
.card-body { padding: 8px 10px 10px; }

.card-title {
  font-size: 11px;
  line-height: 1.45;
  color: var(--text-title);
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  margin-bottom: 8px;
  min-height: 32px;
}

.views-row { display: flex; align-items: baseline; gap: 5px; margin-bottom: 7px; }
.views-count { font-size: 22px; font-weight: bold; color: var(--text-strong); font-variant-numeric: tabular-nums; }
.views-unit  { font-size: 11px; color: var(--text-muted); }
.growth-inline { margin-left: auto; white-space: nowrap; }
.growth-num  { font-size: 13px; color: var(--text-strong); font-variant-numeric: tabular-nums; }
.growth-unit { font-size: 11px; color: var(--text-muted); }

/* 再生数推移グラフ（カード内アコーディオン展開） */
.spark-trigger { cursor: pointer; }
.spark-trigger:hover { text-decoration: underline dotted var(--accent); text-underline-offset: 3px; }
.card-chart { height: 0; overflow: hidden; transition: height .22s ease; }
.card-chart.open { height: 128px; }
.card-chart .cchart { display: block; width: 100%; height: 120px; margin: 6px 0 2px; cursor: crosshair; }

/* ── Achievement badge ─────────────────────────────── */
.achieved-badge {
  background: linear-gradient(135deg, var(--gold-bg2), var(--gold-bg));
  border: 1px solid var(--gold-badge-line);
  border-radius: 6px;
  padding: 5px 9px;
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 6px;
}
.achieved-icon { font-size: 14px; }
.achieved-text { font-size: 11px; color: var(--gold); font-weight: bold; }

/* ── Milestone row ─────────────────────────────────── */
.milestone-row {
  background: var(--surface-inset);
  border-radius: 6px;
  padding: 6px 9px;
  margin-bottom: 5px;
}
.milestone-label { font-size: 9px; color: var(--text-label); letter-spacing: 1px; margin-bottom: 3px; }
.milestone-next  { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.milestone-target    { font-size: 14px; font-weight: bold; color: var(--milestone); }
.milestone-remaining { font-size: 10px; color: var(--text-dim); }
.milestone-eta { font-size: 11px; font-weight: bold; white-space: nowrap; }
.milestone-eta.soon    { color: var(--orange); }
.milestone-eta.normal  { color: var(--eta-normal); }
.milestone-eta.unknown { color: var(--text-faint); }

.progress-wrap { height: 3px; background: var(--surface-sunken); border-radius: 2px; margin-top: 5px; overflow: hidden; }
.progress-bar  { height: 100%; border-radius: 2px; transition: width .4s; }
.progress-bar.approaching { background: linear-gradient(90deg, var(--progress-soon1), var(--orange)); }
.progress-bar.normal      { background: linear-gradient(90deg, var(--progress1), var(--accent)); }

.card-bottom { display: flex; align-items: center; justify-content: space-between; gap: 4px; margin-top: 5px; }
.publish-row { font-size: 9px; color: var(--text-faint); }

/* ── Status messages ───────────────────────────────── */
.status-msg { text-align: center; padding: 60px 20px; font-size: 13px; color: var(--text-muted); }
.error-msg {
  background: var(--err-bg);
  border: 1px solid var(--err-border);
  border-radius: 8px;
  padding: 12px 16px;
  margin: 12px;

<script>
// ─── マイルストーン生成 ───────────────────────────────
// 10万刻み(〜90万) → 50万刻み(100万〜500万) → 100万刻み(600万〜900万) → 500万刻み(1000万〜)
const MILESTONES = (() => {
  const m = [];
  for (let i = 1; i <=  9; i++) m.push(i *   100_000); // 10万〜90万
  for (let i = 2; i <= 10; i++) m.push(i *   500_000); // 100万〜500万
  for (let i = 6; i <=  9; i++) m.push(i * 1_000_000); // 600万〜900万
  for (let i = 2; i <= 40; i++) m.push(i * 5_000_000); // 1000万〜2億
  return m;
})();

function getNextMilestone(views) {
  return MILESTONES.find(m => m > views) || null;
}

function getPrevMilestone(views) {
  return [...MILESTONES].reverse().find(m => m <= views) || 0;
}

// ─── ストレージ ───────────────────────────────────────
const IS_PUBLIC_MODE = new URLSearchParams(location.search).get('mode') === 'public';
const STORE_KEY = IS_PUBLIC_MODE ? 'kanade_milestone_tracker_public' : 'kanade_milestone_tracker';

let store = {
  settings: {
    apiKey: '',
    channelHandle: 'OtonoseKanade',
    thresholdDays: 3,
    refreshMinutes: 30,
    showMarkedOnly: true,
    sortBy: 'soon',
    ownChannelId: '',  // チャンネル取得時に保存
    notifEnabled: true
  },
  videos: {},
  lastUpdated: null,
  markedIds: [],            // 手動マーク済み動画ID
  pinnedVideoIds: [],       // 手動追加した動画ID（他チャンネル含む）
  pinnedPlaylistIds: [],    // 監視プレイリストID
  pinnedPlaylistMeta: {},   // { playlistId: { title } } 表示名キャッシュ
  notified: {}              // 通知済みマイルストーン { "videoId:milestone": timestamp }
};

let markedSet      = new Set();
let showMarkedOnly = true;
let channelFilter  = 'all'; // 'all' | 'own' | 'external'
let searchQuery    = '';    // タイトル検索（保存しない）

let publicMode            = false;
let publicAutoRefresh     = false;
let publicRefreshTimer    = null;
const PUBLIC_REFRESH_MS   = 10 * 60 * 1000;

async function publicRefetch() {
  try {
    const t = Date.now();
    const [data, cfg] = await Promise.all([
      fetch(`./public_data.json?t=${t}`).then(r => r.json()),
      fetch(`./public_config.json?t=${t}`).then(r => r.json()),
    ]);
    store.videos                 = data.videos || {};
    store.settings.ownChannelId  = data.ownChannelId || '';
    store.lastUpdated            = data.lastUpdated  || null;
    store.settings.thresholdDays = cfg.thresholdDays || 3;
    markedSet                    = new Set(cfg.markedIds || []);
    store.pinnedVideoIds         = cfg.pinnedVideoIds || [];
    if (store.lastUpdated) {
      showLastUpdated();
    }
    const analyses = Object.keys(store.videos).map(analyzeVideo).filter(Boolean);
    checkAndNotify(analyses);
    renderMain();
  } catch(e) {}
}

function togglePublicAutoRefresh(forceOn) {
  publicAutoRefresh = forceOn !== undefined ? forceOn : !publicAutoRefresh;
  const btn = document.getElementById('refreshBtn');
  btn.classList.toggle('active', publicAutoRefresh);
  btn.title = publicAutoRefresh ? '自動更新 ON（クリックで停止）' : '自動更新 OFF（クリックで開始）';
  clearInterval(publicRefreshTimer);
  if (publicAutoRefresh) {
    publicRefreshTimer = setInterval(publicRefetch, PUBLIC_REFRESH_MS);
  } else if (store.settings.notifEnabled) {
    // 自動更新OFFにしたら通知も連動してOFFに
    store.settings.notifEnabled = false;
    saveStore();
    updateNotifBtn();
  }
}

function loadStore() {
  try {
    const s = localStorage.getItem(STORE_KEY);
    if (s) {
      const parsed = JSON.parse(s);
      store = { ...store, ...parsed, settings: { ...store.settings, ...parsed.settings } };
    }
  } catch(e) {}
  markedSet     = new Set(store.markedIds || []);
  channelFilter  = store.settings.channelFilter  ?? 'all';
  showMarkedOnly = store.settings.showMarkedOnly ?? true;
  sortBy         = store.settings.sortBy         ?? 'soon';
}

function saveStore() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(store)); } catch(e) {}
}

// ─── フォーマット ──────────────────────────────────────
function fmtViewsUnit(n) {
  if (n >= 100_000_000) return { val: (Math.floor(n / 1_000_000) / 100).toFixed(2), unit: '億' };
  if (n >= 10_000)      return { val: (Math.floor(n / 1_000) / 10).toFixed(1),       unit: '万' };
  return { val: n.toLocaleString(), unit: '' };
}

function fmtViews(n) {
  const { val, unit } = fmtViewsUnit(n);
  return val + unit;
}

function fmtMilestone(n) {
  if (n >= 100_000_000) return (n / 100_000_000) + '億';
  if (n >= 10_000)      return (n / 10_000) + '万';
  return n.toLocaleString();
}

function fmtDays(days) {
  if (days <= 0)   return '今日中！';
  if (days < 0.5)  return '今日中！';
  if (days < 1.5)  return '明日';
  return `約${Math.ceil(days)}日後`;
}

// estimatedDays から予想到達日時を「今日 HH:MM」「明日 HH:MM」「M/D HH:MM」形式で返す
function fmtEta(days) {
  if (days <= 0) return 'まもなく';
  const now = new Date();
  const eta = new Date(Date.now() + days * 24 * 3600 * 1000);
  const hhmm = String(eta.getHours()).padStart(2,'0') + ':' + String(eta.getMinutes()).padStart(2,'0');
  // 24時間以内かではなく日付で今日/明日を判定
  const today  = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const etaDay = new Date(eta.getFullYear(), eta.getMonth(), eta.getDate());
  const diff   = Math.round((etaDay - today) / 86400000);
  if (diff === 0) return `今日 ${hhmm}`;
  if (diff === 1) return `明日 ${hhmm}`;
  return `${eta.getMonth()+1}/${eta.getDate()} ${hhmm}`;
}

// 時刻を「昨日 HH:MM」「今日 HH:MM」「明日 HH:MM」「M/D HH:MM」で返す（過去・未来どちらも可）
function fmtDayTime(ts) {
  const d = new Date(ts), now = new Date();
  const hhmm = String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
  const diff = Math.round((new Date(d.getFullYear(), d.getMonth(), d.getDate())
                         - new Date(now.getFullYear(), now.getMonth(), now.getDate())) / 86400000);
  if (diff === -1) return `昨日 ${hhmm}`;
  if (diff === 0)  return `今日 ${hhmm}`;
  if (diff === 1)  return `明日 ${hhmm}`;
  return `${d.getMonth()+1}/${d.getDate()} ${hhmm}`;
}

// estimatedDays から到達予想日を「M/D頃」で返す（数日先の予想に時刻の精度は無いので日付まで）
function fmtEtaDate(days) {
  const eta = new Date(Date.now() + Math.max(0, days) * 24 * 3600 * 1000);
  return `${eta.getMonth()+1}/${eta.getDate()}頃`;
}

function fmtDatetime(ts) {
  const d = new Date(ts);
  return `${d.getMonth()+1}/${d.getDate()} `
       + `${String(d.getHours()).padStart(2,'0')}:`
       + `${String(d.getMinutes()).padStart(2,'0')}`;
}

function localTzLabel() {
  const off = -new Date().getTimezoneOffset(); // 分単位、JSTは540
  const h = Math.floor(Math.abs(off) / 60);
  const m = Math.abs(off) % 60;
  const sign = off >= 0 ? '+' : '-';
  return m ? `UTC${sign}${h}:${String(m).padStart(2,'0')}` : `UTC${sign}${h}`;
}

// 最終更新の表示。日本時間の閲覧者にはタイムゾーンを出さない
function showLastUpdated() {
  if (!store.lastUpdated) return;
  const isJst = -new Date().getTimezoneOffset() === 540;
  document.getElementById('lastUpdated').textContent =
    `最終更新 ${fmtDatetime(store.lastUpdated)}${isJst ? '' : ' (' + localTzLabel() + ')'}`;
}

// ─── テーマ切り替え ─────────────────────────────────────
// ボタンには切り替え先を出す（ダーク中は☀、ライト中は🌙）
function updateThemeBtn() {
  const light = document.documentElement.dataset.theme === 'light';
  const btn = document.getElementById('themeBtn');
  btn.textContent = light ? '🌙' : '☀';
  btn.title = light ? 'ダーク表示に切り替え' : 'ライト表示に切り替え';
}
function applyTheme(t) {
  document.documentElement.dataset.theme = t;
  updateThemeBtn();
  cardCharts.redrawOpen();  // canvas は CSS 変数の変更に追従しないので描き直す
}
function toggleTheme() {
  const t = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light';
  try { localStorage.setItem('km_theme', t); } catch (e) {}
  applyTheme(t);
}
// 手動で選んでいない間は OS の設定変更に追従する
matchMedia('(prefers-color-scheme: light)').addEventListener('change', e => {
  let saved = null;
  try { saved = localStorage.getItem('km_theme'); } catch (err) {}
  if (!saved) applyTheme(e.matches ? 'light' : 'dark');
});

// グラフ（canvas）の色を CSS 変数 --chart-* から読む。テーマ切り替えに追従させるため描画のたびに読む
const CHART_COLOR_KEYS = ['empty', 'band', 'grid', 'axis', 'date', 'viewsFill', 'views', 'fit', 'end',
  'endLabel', 'velAxis', 'vel', 'cross', 'hoverDot', 'strip', 'readout', 'legend'];
function chartColors() {
  const cs = getComputedStyle(document.documentElement);
  const c = {};
  for (const k of CHART_COLOR_KEYS) c[k] = cs.getPropertyValue('--chart-' + k).trim();
  return c;
}

// タイトル検索用の正規化。全角半角・大文字小文字・カタカナひらがな・空白記号の揺れを吸収する
function normSearch(s) {
  return (s || '').normalize('NFKC').toLowerCase()
    .replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60))
    .replace(/[\s\p{P}\p{S}]/gu, '');
}

// 秒数 → "H:MM:SS" / "M:SS"
function fmtDuration(secs) {
  if (!secs) return '';
  const h = Math.floor(secs / 3600);
  const m = Math.floor((secs % 3600) / 60);
  const s = secs % 60;
  if (h > 0) return `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  return `${m}:${String(s).padStart(2,'0')}`;
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ISO 8601 duration → 秒数 (例: "PT1M30S" → 90)
function parseDuration(iso) {
  const m = iso.match(/PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/);
  if (!m) return 0;
  return (parseInt(m[1] || 0) * 3600) + (parseInt(m[2] || 0) * 60) + parseInt(m[3] || 0);
}


// ─── YouTube Data API ──────────────────────────────────
async function apiGet(endpoint, params) {
  const url = new URL(`https://www.googleapis.com/youtube/v3/${endpoint}`);
  params.key = store.settings.apiKey;
  Object.entries(params).forEach(([k, v]) => url.searchParams.set(k, v));
  const res = await fetch(url);
  const data = await res.json();
  if (!res.ok) {
    const msg = data.error?.message || res.statusText;
    throw new Error(`YouTube API エラー [${res.status}]: ${msg}`);
  }
  return data;
}

async function fetchPlaylistVideoIds(playlistId) {
  const ids = [];
  let pageToken = null;
  do {
    const params = { part: 'contentDetails', playlistId, maxResults: 50 };
    if (pageToken) params.pageToken = pageToken;
    const pl = await apiGet('playlistItems', params);
    ids.push(...pl.items.map(i => i.contentDetails.videoId));
    pageToken = pl.nextPageToken || null;
  } while (pageToken);
  return ids;
}

async function fetchAllVideos() {
  // チャンネルの uploads プレイリスト ID とチャンネルID を取得
  const chRes = await apiGet('channels', {
    part: 'id,contentDetails',
    forHandle: store.settings.channelHandle
  });
  if (!chRes.items?.length) {
    throw new Error('チャンネルが見つかりません: ' + store.settings.channelHandle);
  }
  const ownChannelId = chRes.items[0].id;
  store.settings.ownChannelId = ownChannelId;
  const uploadsId = chRes.items[0].contentDetails.relatedPlaylists.uploads;

  // 全動画IDを取得（50件ずつページネーション）
  const videoIds = [];
  let pageToken = null;
  let pageCount = 0;
  do {
    const params = { part: 'contentDetails', playlistId: uploadsId, maxResults: 50 };
    if (pageToken) params.pageToken = pageToken;
    const pl = await apiGet('playlistItems', params);
    videoIds.push(...pl.items.map(i => i.contentDetails.videoId));
    pageToken = pl.nextPageToken || null;
    pageCount++;
  } while (pageToken);
  console.log(`[fetch] playlistItems: ${pageCount}ページ, 計${videoIds.length}件のID取得`);

  // 動画の統計・情報を50本ずつバッチ取得
  const now = Date.now();
  const cutoff7d = now - 7 * 24 * 3600 * 1000;
  let storedCount = 0, skippedUpcoming = 0;

  for (let i = 0; i < videoIds.length; i += 50) {
    const batch = videoIds.slice(i, i + 50);
    const vRes = await apiGet('videos', {
      part: 'statistics,snippet,contentDetails',
      id: batch.join(',')
    });
    for (const item of (vRes.items || [])) {
      // 配信中・公開前は除外（再生数が確定していないため）
      const lbc = item.snippet.liveBroadcastContent;
      if (lbc === 'live' || lbc === 'upcoming') { skippedUpcoming++; continue; }
      // 再生数が取れない動画（メンバー限定等）は除外
      if (item.statistics?.viewCount === undefined) continue;

      const dur    = parseDuration(item.contentDetails?.duration || '');
      const views  = parseInt(item.statistics.viewCount || '0');
      const thumb  = item.snippet.thumbnails.medium?.url
                  || item.snippet.thumbnails.default?.url || '';

      if (!store.videos[item.id]) {
        store.videos[item.id] = {
          title: item.snippet.title,
          thumbnail: thumb,
          publishedAt: item.snippet.publishedAt,
          duration: dur,
          channelId: item.snippet.channelId,
          history: []
        };
      }
      store.videos[item.id].title     = item.snippet.title;
      store.videos[item.id].thumbnail = thumb;
      store.videos[item.id].duration  = dur;
      store.videos[item.id].channelId = item.snippet.channelId;

      const hist = store.videos[item.id].history;
      if (!hist.length || hist[hist.length - 1].views !== views) {
        hist.push({ ts: now, views });
      }
      store.videos[item.id].history = hist.filter(h => h.ts >= cutoff7d);
      storedCount++;
    }
  }
  console.log(`[fetch] 保存: ${storedCount}件 / スキップ(配信中/未公開): ${skippedUpcoming}件`);

  // ピン留め動画（チャンネル外）の統計を更新
  const pinnedIds = (store.pinnedVideoIds || []).filter(id => {
    const v = store.videos[id];
    if (!v || !v.channelId) return true; // channelId未設定は再取得
    return v.channelId !== ownChannelId;  // 他チャンネルのみ
  });
  if (pinnedIds.length) {
    for (let i = 0; i < pinnedIds.length; i += 50) {
      const batch = pinnedIds.slice(i, i + 50);
      const pRes = await apiGet('videos', {
        part: 'statistics,snippet,contentDetails',
        id: batch.join(',')
      });
      for (const item of (pRes.items || [])) {
        if (item.statistics?.viewCount === undefined) continue;
        const dur   = parseDuration(item.contentDetails?.duration || '');
        const views = parseInt(item.statistics.viewCount || '0');
        const thumb = item.snippet.thumbnails.medium?.url || item.snippet.thumbnails.default?.url || '';
        if (!store.videos[item.id]) {
          store.videos[item.id] = {
            title: item.snippet.title,
            thumbnail: thumb,
            publishedAt: item.snippet.publishedAt,
            duration: dur,
            channelId: item.snippet.channelId,
            history: []
          };
        }
        store.videos[item.id].title     = item.snippet.title;
        store.videos[item.id].thumbnail = thumb;
        store.videos[item.id].duration  = dur;
        store.videos[item.id].channelId = item.snippet.channelId;
        const hist = store.videos[item.id].history;
        if (!hist.length || hist[hist.length - 1].views !== views) {
          hist.push({ ts: now, views });
        }
        store.videos[item.id].history = hist.filter(h => h.ts >= cutoff7d);
      }
    }
    console.log(`[fetch] ピン留め動画更新: ${pinnedIds.length}件`);
  }

  // 監視プレイリストから動画IDを収集・統計更新
  const watchedPlaylists = store.pinnedPlaylistIds || [];
  if (watchedPlaylists.length) {
    const plVideoIds = new Set();
    for (const plId of watchedPlaylists) {
      try {
        const ids = await fetchPlaylistVideoIds(plId);
        ids.forEach(id => plVideoIds.add(id));
      } catch(e) {
        console.warn(`[fetch] プレイリスト取得エラー [${plId}]:`, e.message);
      }
    }
    // 自チャンネル動画は既に更新済みなので除外
    const plIds = [...plVideoIds].filter(id => {
      const v = store.videos[id];
      return !v || v.channelId !== ownChannelId;
    });
    if (plIds.length) {
      for (let i = 0; i < plIds.length; i += 50) {
        const batch = plIds.slice(i, i + 50);
        const pRes = await apiGet('videos', {
          part: 'statistics,snippet,contentDetails',
          id: batch.join(',')
        });
        for (const item of (pRes.items || [])) {
          if (item.statistics?.viewCount === undefined) continue;
          const lbc = item.snippet.liveBroadcastContent;
          if (lbc === 'live' || lbc === 'upcoming') continue;
          const dur   = parseDuration(item.contentDetails?.duration || '');
          const views = parseInt(item.statistics.viewCount || '0');
          const thumb = item.snippet.thumbnails.medium?.url || item.snippet.thumbnails.default?.url || '';
          if (!store.videos[item.id]) {
            store.videos[item.id] = {
              title: item.snippet.title, thumbnail: thumb,
              publishedAt: item.snippet.publishedAt,
              duration: dur, channelId: item.snippet.channelId, history: []
            };
          }
          store.videos[item.id].title     = item.snippet.title;
          store.videos[item.id].thumbnail = thumb;
          store.videos[item.id].duration  = dur;
          store.videos[item.id].channelId = item.snippet.channelId;
          const hist = store.videos[item.id].history;
          if (!hist.length || hist[hist.length - 1].views !== views) hist.push({ ts: now, views });
          store.videos[item.id].history = hist.filter(h => h.ts >= cutoff7d);
        }
      }
      console.log(`[fetch] プレイリスト動画更新: ${plIds.length}件`);
    }
  }

  store.lastUpdated = now;
  saveStore();
}

// ─── 解析 ──────────────────────────────────────────────
function calcGrowthPerDay(history) {
  if (history.length < 2) return null;
  const now = Date.now();
  const cutoff72h = now - 72 * 3600 * 1000;
  // 直近72時間のデータを優先、足りなければ全履歴
  let win = history.filter(h => h.ts >= cutoff72h);
  if (win.length < 2) win = history;
  if (win.length < 2) return null;

  // 最小二乗法で増加速度を推定（全中間点を活用）
  const n = win.length;
  const xs = win.map(h => h.ts / 86400000); // msを日単位に変換
  const ys = win.map(h => h.views);
  const xMean = xs.reduce((a, b) => a + b) / n;
  const yMean = ys.reduce((a, b) => a + b) / n;
  const num = xs.reduce((s, x, i) => s + (x - xMean) * (ys[i] - yMean), 0);
  const den = xs.reduce((s, x)    => s + (x - xMean) ** 2, 0);
  if (den < 1e-9) return null;
  return num / den; // [views/day]
}

function getRecentlyAchieved(history, hours = 48) {
  if (history.length < 2) return null;
  const cutoff48h = Date.now() - hours * 3600 * 1000;
  const recent = history.filter(h => h.ts >= cutoff48h);
  if (recent.length === 0) return null;

  const oldViews = recent[0].views;
  const newViews = history[history.length - 1].views;
  // 指定時間内に超えたマイルストーンのうち最大のものを返す
  const achieved = MILESTONES.filter(m => oldViews < m && newViews >= m);
  return achieved.length > 0 ? achieved[achieved.length - 1] : null;
}

function analyzeVideo(videoId) {
  const video = store.videos[videoId];
  if (!video || !video.history.length) return null;

  const currentViews  = video.history[video.history.length - 1].views;
  const nextMilestone = getNextMilestone(currentViews);
  const growthPerDay  = calcGrowthPerDay(video.history);
  const recentlyAchieved     = getRecentlyAchieved(video.history, 48);
  const recentlyAchieved24h  = getRecentlyAchieved(video.history, 24);
  const ownCh = store.settings.ownChannelId;
  const isExternal = !!(ownCh && video.channelId && video.channelId !== ownCh);

  // 最終取得から現在までの経過分を増加速度で補正してETAを計算
  let estimatedDays = null;
  if (nextMilestone && growthPerDay > 0) {
    const lastTs = video.history[video.history.length - 1].ts;
    const elapsedDays = (Date.now() - lastTs) / 86400000;
    estimatedDays = (nextMilestone - currentViews) / growthPerDay - elapsedDays;
  }

  // 直近に達成した節目を初めて上回った記録の時刻（達成時刻の目安。取得間隔ぶん遅れる）
  const achievedAt = recentlyAchieved !== null
    ? (video.history.find(h => h.views >= recentlyAchieved) || {}).ts ?? null
    : null;

  return {
    id: videoId,
    achievedAt,
    title:         video.title,
    thumbnail:     video.thumbnail,
    publishedAt:   video.publishedAt,
    duration:      video.duration || 0,
    currentViews,
    nextMilestone,
    growthPerDay,
    estimatedDays,
    recentlyAchieved,
    isApproaching:       estimatedDays !== null && estimatedDays <= store.settings.thresholdDays,
    hasAchievement:      recentlyAchieved !== null,
    achievedWithin1Day: recentlyAchieved24h !== null,
    isExternal
  };
}

function exportData() {
  const json = JSON.stringify(store, null, 2);
  const blob = new Blob([json], { type: 'application/json' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href     = url;
  a.download = `kanade_milestone_${new Date().toISOString().slice(0, 10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

function importData() {
  document.getElementById('importFile').click();
}

function onImportFile(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const parsed = JSON.parse(e.target.result);
      if (!parsed.videos || !parsed.settings) { alert('無効なデータ形式です'); return; }
      store = { ...store, ...parsed, settings: { ...store.settings, ...parsed.settings } };
      markedSet      = new Set(store.markedIds || []);
      showMarkedOnly = store.settings.showMarkedOnly ?? true;
      sortBy         = store.settings.sortBy         ?? 'soon';
      saveStore();
      closeSettings();
      renderMain();
      updatePageTitle();
      alert('インポート完了');
    } catch(err) {
      alert('JSONの解析に失敗しました: ' + err.message);
    }
    input.value = '';
  };
  reader.readAsText(file);
}

function buildTweetUrl(a) {
  const ytUrl = `https://youtu.be/${a.id}`;
  let text;
  if (a.hasAchievement) {
    text = `${a.title} ${ytUrl} 【${fmtMilestone(a.recentlyAchieved)}再生達成🎉】`;
  } else if (a.isApproaching && a.nextMilestone) {
    text = `${a.title} ${ytUrl} まもなく${fmtMilestone(a.nextMilestone)}再生！（あと${fmtViews(a.nextMilestone - a.currentViews)}）`;
  } else {
    text = `${a.title} ${ytUrl} ${fmtViews(a.currentViews)}再生`;
  }
  return `https://twitter.com/intent/tweet?text=${encodeURIComponent(text)}`;
}

// Branding Guidelines はロゴがYouTubeのコンテンツへ戻ることを求めており、
// 本ツールはチャンネルを差し替えて使えるので固定URLにはできない。
function updateAttributionLink() {
  const a = document.getElementById('ytAttribution');
  if (!a) return;
  const id     = store.settings.ownChannelId || '';
  const handle = (store.settings.channelHandle || '').replace(/^@/, '');
  // チャンネルIDが最も確実。未解決ならハンドル、どちらも無ければYouTubeトップ
  const url = id     ? `https://www.youtube.com/channel/${encodeURIComponent(id)}`
            : handle ? `https://www.youtube.com/@${encodeURIComponent(handle)}`
            :          'https://www.youtube.com/';
  a.href = url;
  a.setAttribute('aria-label',
    handle ? `${handle} のチャンネルをYouTubeで開く` : 'YouTubeを開く');
}

function updateNotifBtn() {
  const btn = document.getElementById('notifBtn');
  if (!btn || !('Notification' in window)) { if (btn) btn.style.display = 'none'; return; }
  if (Notification.permission === 'denied') {
    btn.textContent = '🔕'; btn.classList.remove('active'); btn.title = '通知がブロックされています（ブラウザ設定から変更してください）';
  } else if (Notification.permission === 'granted' && store.settings.notifEnabled) {
    btn.textContent = '🔔'; btn.classList.add('active'); btn.title = '通知ON（クリックで解除）';
  } else {
    btn.textContent = '🔔'; btn.classList.remove('active'); btn.title = '通知を有効にする';
  }
}

async function requestNotif() {
  if (!('Notification' in window)) { alert('このブラウザは通知に対応していません'); return; }
  if (Notification.permission === 'denied') { alert('通知がブロックされています。ブラウザのサイト設定から許可してください'); return; }
  if (Notification.permission === 'granted') {
    store.settings.notifEnabled = !store.settings.notifEnabled;
    if (publicMode) {
      if (store.settings.notifEnabled && !publicAutoRefresh) togglePublicAutoRefresh(true);
      if (!store.settings.notifEnabled && publicAutoRefresh) togglePublicAutoRefresh(false);
    }
    saveStore();
    updateNotifBtn();
    return;
  }
  await Notification.requestPermission();
  if (Notification.permission === 'granted') {
    store.settings.notifEnabled = true;
    if (publicMode && !publicAutoRefresh) togglePublicAutoRefresh(true);
  }
  saveStore();
  updateNotifBtn();
}

function checkAndNotify(analyses) {
  if (!('Notification' in window) || Notification.permission !== 'granted') return;
  if (!store.settings.notifEnabled) return;
  const now = Date.now();
  // 7日より古い通知済み記録を削除
  Object.keys(store.notified).forEach(k => {
    if (now - store.notified[k] > 7 * 24 * 3600 * 1000) delete store.notified[k];
  });
  let updated = false;
  for (const a of analyses) {
    if (!a.recentlyAchieved) continue;
    if (!markedSet.has(a.id)) continue;
    const key = `${a.id}:${a.recentlyAchieved}`;
    if (store.notified[key]) continue;
    store.notified[key] = now;
    updated = true;
    try {
      new Notification('🎉 マイルストーン達成！', {
        body: `${a.title}\n${fmtMilestone(a.recentlyAchieved)}再生 達成`,
        icon: a.thumbnail || undefined
      });
    } catch(e) {}
  }
  if (updated) saveStore();
}

// hero=true は「達成」「もうすぐ」の島に載せるカード。到達予想（達成）を一番大きく出す
function buildCard(a, hero = false) {
  const statusCls = a.hasAchievement      ? 'achieved'
                 : a.achievedWithin1Day ? 'achieved-1d'
                 : a.isApproaching       ? 'approaching' : '';
  const cardCls = [statusCls, a.isExternal ? 'external' : ''].filter(Boolean).join(' ');
  const { val, unit } = fmtViewsUnit(a.currentViews);

  // 進捗バー（前マイルストーン〜次マイルストーン間）
  const prevMs = getPrevMilestone(a.currentViews);
  const progressRatio = a.nextMilestone
    ? (a.currentViews - prevMs) / (a.nextMilestone - prevMs)
    : 1;

  // ETA表示: もうすぐ判定の場合のみ時刻精度、それ以外は日数表示
  let etaHtml;
  if (a.estimatedDays !== null) {
    const cls     = a.isApproaching ? 'soon' : 'normal';
    // もうすぐ判定は時刻まで、それ以外は日数に日付を添える
    etaHtml = a.isApproaching
      ? `<span class="milestone-eta ${cls}">${fmtEta(a.estimatedDays)}</span>`
      : `<span class="milestone-eta ${cls}">${fmtDays(a.estimatedDays)}<span class="eta-date">（${fmtEtaDate(a.estimatedDays)}）</span></span>`;
  } else {
    etaHtml = `<span class="milestone-eta unknown">勢い計算中</span>`;
  }

  // 投稿日・経過日数
  const pub = new Date(a.publishedAt);
  const elapsed = Math.floor((Date.now() - pub.getTime()) / (1000 * 3600 * 24));
  const publishStr = `投稿: ${pub.getFullYear()}/${pub.getMonth()+1}/${pub.getDate()} · ${elapsed}日前`;

  const achievedHtml = (a.hasAchievement && !hero) ? `
    <div class="achieved-badge">
      <span class="achieved-icon">🎉</span>
      <span class="achieved-text">${fmtMilestone(a.recentlyAchieved)}再生 達成！</span>
    </div>` : '';

  // 島のカード: 達成なら「◯万回 達成」、もうすぐなら到達予想時刻を主役にする
  const progressHtml = `
      <div class="progress-wrap">
        <div class="progress-bar ${a.isApproaching ? 'approaching' : 'normal'}"
             style="width:${Math.min(100, progressRatio * 100).toFixed(1)}%"></div>
      </div>`;
  let heroHtml = '';
  if (hero && a.hasAchievement) {
    heroHtml = `
    <div class="hero achieved">
      <div class="hero-label">🎉 節目達成</div>
      <div class="hero-main">${fmtMilestone(a.recentlyAchieved)}<span class="hero-unit">回 達成</span></div>
      ${a.achievedAt ? `<div class="hero-sub">${fmtDayTime(a.achievedAt)}頃に到達</div>` : ''}
    </div>`;
  } else if (hero && a.isApproaching && a.nextMilestone) {
    heroHtml = `
    <div class="hero soon">
      <div class="hero-label">${fmtMilestone(a.nextMilestone)}まで あと${fmtViews(a.nextMilestone - a.currentViews)}</div>
      <div class="hero-main">${fmtEta(a.estimatedDays)}${a.estimatedDays > 0 ? '<span class="hero-unit">頃</span>' : ''}</div>
      ${progressHtml}
    </div>`;
  }

  const milestoneHtml = (a.nextMilestone && !(hero && a.isApproaching && !a.hasAchievement)) ? `
    <div class="milestone-row">
      <div class="milestone-label">NEXT MILESTONE</div>
      <div class="milestone-next">
        <span class="milestone-target">${fmtMilestone(a.nextMilestone)}</span>
        <span class="milestone-remaining">あと ${fmtViews(a.nextMilestone - a.currentViews)}</span>
        ${etaHtml}
      </div>
      <div class="progress-wrap">
        <div class="progress-bar ${a.isApproaching ? 'approaching' : 'normal'}"
             style="width:${Math.min(100, progressRatio * 100).toFixed(1)}%"></div>
      </div>
    </div>` : '';

  const growthHtml = a.growthPerDay !== null
    ? (() => { const g = fmtViewsUnit(Math.round(a.growthPerDay));
        return `<span class="growth-num">+${g.val}</span><span class="growth-unit">${g.unit}/日</span>`; })()
    : '<span class="growth-unit">データ蓄積中...</span>';

  const externalBadgeHtml = a.isExternal
    ? '<div class="external-badge-row"><span class="external-badge">他チャンネル</span></div>'
    : '';

  const isMarked  = markedSet.has(a.id);
  const durStr    = fmtDuration(a.duration);
  const tweetUrl  = buildTweetUrl(a);

  const card = document.createElement('div');
  card.className = `card ${cardCls}${isMarked ? ' marked-card' : ''}`;
  // サムネイル部分のみYouTube遷移（数値部分はグラフ展開のトグルに使う）
  card.addEventListener('click', (e) => {
    if (e.target.closest('.thumb-wrap'))
      window.open(`https://www.youtube.com/watch?v=${a.id}`, '_blank', 'noopener,noreferrer');
  });
  card.innerHTML = `
    <div class="thumb-wrap">
      <img class="card-thumb" src="${escHtml(a.thumbnail)}" loading="lazy" alt="">
      ${durStr ? `<span class="thumb-duration">${escHtml(durStr)}</span>` : ''}
    </div>
    <button class="mark-btn card-btn${isMarked ? ' marked' : ''}"
            onclick="toggleMark('${a.id}')" title="${isMarked ? 'マーク解除' : 'マーク'}">★</button>
    <div class="card-body">
      <div class="card-title">${escHtml(a.title)}</div>
      ${externalBadgeHtml}
      ${heroHtml}
      <div class="views-row${hero ? ' compact' : ''}">
        <span class="views-count spark-trigger" data-vid="${a.id}">${val}</span>
        <span class="views-unit spark-trigger" data-vid="${a.id}">${unit}再生</span>
        <span class="growth-inline spark-trigger" data-vid="${a.id}">${growthHtml}</span>
      </div>
      <div class="card-chart${openChartVids.has(a.id) ? ' open' : ''}"><canvas class="cchart" data-vid="${a.id}"></canvas></div>
      ${achievedHtml}
      ${milestoneHtml}
      <div class="card-bottom">
        <div class="publish-row">${escHtml(publishStr)}</div>
        <a class="tweet-btn card-btn" href="${escHtml(tweetUrl)}"
           target="_blank" rel="noopener" onclick="event.stopPropagation()">🐦 ツイート</a>
      </div>
    </div>`;
  return card;
}

/* ─── カード内 再生数推移グラフ（クリックでアコーディオン展開・開いたカードのみ描画） ─── */
let openChartVids = new Set();  // 展開中の動画id（renderMain再描画をまたいで維持）
const cardCharts = (function initCardChart() {
  const OL = 42, RAX = 44, OT = 16, OB = 16;  // 内側マージン（左=再生数軸/右=勢い軸/上=凡例帯/下=日付）

  const fmtN   = n  => Math.round(n).toLocaleString('ja-JP');
  const fmtDay = ts => { const d = new Date(ts); return (d.getMonth()+1) + '/' + d.getDate(); };
  const fmtDT  = ts => { const d = new Date(ts);
    return (d.getMonth()+1) + '/' + d.getDate() + ' ' +
      String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0'); };
  const fmtMan = n => Math.abs(n) >= 1e8
    ? (n/1e8).toLocaleString('ja-JP', {maximumFractionDigits:2}) + '億'
    : (n/1e4).toLocaleString('ja-JP', {maximumFractionDigits:1}) + '万';
  function niceTicks(lo, hi, n) {
    const span = hi - lo; if (span <= 0) return [lo];
    const mag = Math.pow(10, Math.floor(Math.log10(span / n)));
    const norm = (span / n) / mag, step = (norm >= 5 ? 5 : norm >= 2 ? 2 : 1) * mag;
    // lo が僅かに負（余白分）だと Math.ceil が -0 を返し「-0万」と表示されるので、+0 で正のゼロに直す
    const out = []; for (let v = Math.ceil(lo/step)*step + 0; v <= hi + 1e-6; v += step) out.push(v);
    return out;
  }
  function regress(pts) {
    const n = pts.length; let sx=0, sy=0, sxx=0, sxy=0;
    for (const p of pts) { const x = p.ts/86400000, y = p.views; sx+=x; sy+=y; sxx+=x*x; sxy+=x*y; }
    const den = n*sxx - sx*sx; if (Math.abs(den) < 1e-9) return null;
    const slope = (n*sxy - sx*sy) / den;
    return { slope, intercept: (sy - slope*sx) / n };
  }
  // 勢い[views/日]：各点の直近24時間移動差分（点間ノイズを平滑化）
  function velocitySeries(hist) {
    const WIN = 24 * 3600 * 1000, out = [];
    let j = 0;
    for (let i = 0; i < hist.length; i++) {
      while (hist[i].ts - hist[j].ts > WIN) j++;
      const dt = (hist[i].ts - hist[j].ts) / 86400000;
      if (dt >= 0.4) out.push({ ts: hist[i].ts, v: (hist[i].views - hist[j].views) / dt });
    }
    return out;
  }

  // canvas(.cchart)に描画。hoverTs指定でその位置にガイド線＋値
  function draw(canvas, hoverTs) {
    const C = chartColors();
    const vid = canvas.dataset.vid, v = store.videos[vid];
    const W = canvas.clientWidth, H = canvas.clientHeight;
    if (W < 20 || H < 20) return;
    const dpr = window.devicePixelRatio || 1;
    canvas.width = W*dpr; canvas.height = H*dpr;
    const ctx = canvas.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.clearRect(0,0,W,H);
    if (!v || !v.history || v.history.length < 2) {
      ctx.fillStyle = C.empty; ctx.font = '10px "Segoe UI",sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('データ蓄積中…', W/2, H/2); return;
    }
    const h = v.history;
    const xmin = h[0].ts, xmax = h[h.length-1].ts;
    let ymin = Infinity, ymax = -Infinity;
    for (const p of h) { if (p.views < ymin) ymin = p.views; if (p.views > ymax) ymax = p.views; }
    if (ymax === ymin) ymax = ymin + 1;
    const pad = (ymax - ymin) * 0.08; ymin -= pad; ymax += pad;
    const plotL = OL, plotR = W - RAX;
    const px = t  => plotL + (t - xmin) / (xmax - xmin) * (plotR - plotL);
    const py = vv => H - OB - (vv - ymin) / (ymax - ymin) * (H - OT - OB);

    // 勢い採用区間（直近72h、2点未満なら全体）＋近似直線
    const win72 = xmax - 72 * 3600 * 1000;
    let win = h.filter(p => p.ts >= win72);
    if (win.length < 2) win = h;
    const reg = regress(win);

    // 採用区間のハイライト帯
    const bandX0 = px(Math.max(win[0].ts, xmin));
    ctx.fillStyle = C.band;
    ctx.fillRect(bandX0, OT, plotR - bandX0, H - OT - OB);

    // Y軸グリッド＋数値（左＝再生数）
    ctx.font = '9px "Segoe UI",sans-serif';
    ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    for (const val of niceTicks(ymin, ymax, 3)) {
      if (val < ymin || val > ymax) continue;
      const y = py(val);
      ctx.strokeStyle = C.grid; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(plotL, y); ctx.lineTo(plotR, y); ctx.stroke();
      ctx.fillStyle = C.axis; ctx.fillText(fmtMan(val), plotL - 4, y);
    }
    // X軸（日付）
    ctx.fillStyle = C.date; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    const spanD = (xmax - xmin) / 86400000, stepD = spanD > 14 ? 7 : spanD > 6 ? 2 : 1;
    const s = new Date(xmin); s.setHours(0,0,0,0);
    for (let ts = s.getTime(); ts <= xmax; ts += stepD*86400000) {
      if (ts < xmin) continue; const x = px(ts);
      ctx.strokeStyle = C.grid; ctx.beginPath(); ctx.moveTo(x, H-OB); ctx.lineTo(x, H-OB+3); ctx.stroke();
      ctx.fillText(fmtDay(ts), x, H-OB+4);
    }
    // 塗り + 折れ線（再生数）
    ctx.beginPath(); h.forEach((p,i) => { const x=px(p.ts), y=py(p.views); i?ctx.lineTo(x,y):ctx.moveTo(x,y); });
    ctx.lineTo(px(xmax), py(ymin)); ctx.lineTo(px(xmin), py(ymin)); ctx.closePath();
    ctx.fillStyle = C.viewsFill; ctx.fill();
    ctx.beginPath(); h.forEach((p,i) => { const x=px(p.ts), y=py(p.views); i?ctx.lineTo(x,y):ctx.moveTo(x,y); });
    ctx.strokeStyle = C.views; ctx.lineWidth = 1.8; ctx.lineJoin = 'round'; ctx.stroke();
    // 近似直線（採用区間）
    if (reg) {
      ctx.strokeStyle = C.fit; ctx.setLineDash([5,3]); ctx.lineWidth = 1.5;
      const xa = win[0].ts, xb = xmax;
      ctx.beginPath();
      ctx.moveTo(px(xa), py(reg.slope*(xa/86400000) + reg.intercept));
      ctx.lineTo(px(xb), py(reg.slope*(xb/86400000) + reg.intercept));
      ctx.stroke(); ctx.setLineDash([]);
    }
    // 終点ドット＋取得日時（点の左側）
    ctx.fillStyle = C.end;
    ctx.beginPath(); ctx.arc(px(xmax), py(h[h.length-1].views), 2.6, 0, 7); ctx.fill();
    {
      const lp = h[h.length-1], lx = px(lp.ts), ly = py(lp.views);
      ctx.font = '8.5px "Segoe UI",sans-serif'; ctx.fillStyle = C.endLabel;
      ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
      ctx.fillText(fmtDT(lp.ts), lx - 6, ly);
    }

    // 勢い（24h移動差分）を右軸で重ねる。案2: ピークを再生数ラインの margin px 下にアンカーして急騰局面の重なりを回避
    // 保持期間（30日）で古いデータが捨てられると、左端の点は24時間前の点を失い、
    // 残った短い区間で勢いが計算し直される。それまで正しく表示していた値が、
    // 左端に来ただけで変わってしまうので、その区間（記録の最初の24時間）は描かない。
    // 公開直後で24時間分が無いだけの動画は、記録開始≒公開なので従来どおり表示する。
    const DAY_MS = 24 * 3600 * 1000;
    const pubMs = Date.parse(v.publishedAt);
    const truncated = !isNaN(pubMs) && pubMs < h[0].ts - DAY_MS;
    const vel = velocitySeries(h).filter(p => !truncated || p.ts >= h[0].ts + DAY_MS);
    let vy = null;
    if (vel.length >= 2) {
      let vmin = Infinity, vmax = -Infinity, tsPeak = vel[0].ts;
      for (const p of vel) { if (p.v < vmin) vmin = p.v; if (p.v > vmax) { vmax = p.v; tsPeak = p.ts; } }
      const vlo = Math.min(0, vmin), vPeak = (vmax > vlo ? vmax : vlo + 1);
      const MARGIN = 14;  // 再生数ラインと勢いピークの縦間隔[px]（要調整）
      // ピーク時刻での再生数ライン高さ（線形補間）
      let viewsAtPeak;
      if (tsPeak <= h[0].ts) viewsAtPeak = h[0].views;
      else if (tsPeak >= h[h.length-1].ts) viewsAtPeak = h[h.length-1].views;
      else { viewsAtPeak = h[h.length-1].views;
        for (let i = 1; i < h.length; i++) if (h[i].ts >= tsPeak) {
          const p0 = h[i-1], p1 = h[i], f = (tsPeak - p0.ts) / (p1.ts - p0.ts);
          viewsAtPeak = p0.views + f * (p1.views - p0.views); break;
        }
      }
      const plotBot = H - OB;
      let yPeak = py(viewsAtPeak) + MARGIN;         // 再生数ラインの下に配置
      // 公開直後の急騰ではピーク時の再生数ラインが底に近く、アンカーすると勢い軸が潰れて読めない。
      // 右軸として読めるよう、プロット高さの半分を最低振幅として確保する（この場合は線が交差しうる）
      yPeak = Math.min(yPeak, plotBot - (plotBot - OT) * 0.5);
      yPeak = Math.max(yPeak, OT + 2);              // 上端はみ出し防止
      vy = vv => plotBot + (vv - vlo) / (vPeak - vlo) * (yPeak - plotBot);
      // 右軸ラベル（勢い・万/日）
      ctx.font = '9px "Segoe UI",sans-serif'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
      ctx.fillStyle = C.velAxis;
      // 目盛が詰まると重なるので、下端（0）から順に描き、直前のラベルと LABEL_GAP px 未満なら間引く。
      // 下端の0を必ず残して、軸の基準が読めるようにする
      const LABEL_GAP = 11;
      let lastY = Infinity;
      for (const val of niceTicks(vlo, vPeak, 3)) {
        if (val < vlo || val > vPeak) continue;
        const y = vy(val);
        if (lastY - y < LABEL_GAP) continue;
        // 1万/日未満の動画は万単位だと目盛が全部「0.1万」に丸まって区別できないので、実数で出す
        ctx.fillText((vPeak < 1e4 ? fmtN(val) : fmtMan(val)) + '/日', plotR + 4, y);
        ctx.fillRect(plotR - 3, Math.round(y), 4, 1);  // ラベルが指す高さを示す目盛線
        lastY = y;
      }
      // 勢いライン
      ctx.strokeStyle = C.vel; ctx.lineWidth = 1.4; ctx.lineJoin = 'round';
      ctx.beginPath();
      vel.forEach((p,i) => { const x = px(p.ts), y = vy(p.v); i ? ctx.lineTo(x,y) : ctx.moveTo(x,y); });
      ctx.stroke();
    }

    // ホバー：クロスヘア＋点、上部に読み値
    let readout = null;
    if (hoverTs != null) {
      let best = h[0], bd = Infinity;
      for (const p of h) { const d = Math.abs(p.ts - hoverTs); if (d < bd) { bd = d; best = p; } }
      const x = px(best.ts), y = py(best.views);
      ctx.strokeStyle = C.cross; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(x, OT); ctx.lineTo(x, H-OB); ctx.stroke();
      ctx.fillStyle = C.hoverDot; ctx.beginPath(); ctx.arc(x, y, 3, 0, 7); ctx.fill();
      let vBest = null, vbd = Infinity;
      if (vy) for (const p of vel) { const d = Math.abs(p.ts - hoverTs); if (d < vbd) { vbd = d; vBest = p; } }
      if (vBest && vy) { ctx.fillStyle = C.vel; ctx.beginPath(); ctx.arc(px(vBest.ts), vy(vBest.v), 3, 0, 7); ctx.fill(); }
      readout = fmtDT(best.ts) + ' ・ ' + fmtN(best.views) + '回'
        + (vBest ? ' ・ 勢い ' + (vBest.v >= 0 ? '+' : '') + fmtMan(vBest.v) + '/日' : '');
    }

    // 上部ストリップ（凡例 or ホバー読み値）を最前面に
    ctx.fillStyle = C.strip; ctx.fillRect(0, 0, W, OT - 2);
    const yc = (OT - 2) / 2;
    if (readout) {
      ctx.font = '9px "Segoe UI",sans-serif'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
      ctx.fillStyle = C.readout; ctx.fillText(readout, plotL, yc);
    } else {
      ctx.lineWidth = 2; ctx.textBaseline = 'middle'; ctx.textAlign = 'left'; ctx.font = '8.5px "Segoe UI",sans-serif';
      ctx.strokeStyle = C.views; ctx.beginPath(); ctx.moveTo(plotL, yc); ctx.lineTo(plotL + 10, yc); ctx.stroke();
      ctx.fillStyle = C.legend; ctx.fillText('再生数', plotL + 13, yc);
      ctx.strokeStyle = C.vel; ctx.beginPath(); ctx.moveTo(plotL + 46, yc); ctx.lineTo(plotL + 56, yc); ctx.stroke();
      ctx.fillStyle = C.legend; ctx.fillText('勢い', plotL + 59, yc);
    }
  }

  // 数値クリック/タップでそのカードのグラフを開閉トグル
  document.addEventListener('click', e => {
    const t = e.target.closest('.spark-trigger'); if (!t) return;
    const card = t.closest('.card'); if (!card) return;
    const panel = card.querySelector('.card-chart'); if (!panel) return;
    const canvas = panel.querySelector('.cchart');
    const vid = canvas.dataset.vid;
    if (panel.classList.contains('open')) {
      panel.classList.remove('open');
      openChartVids.delete(vid);
      // 閉じ切ったらバッキングを解放
      setTimeout(() => { if (!panel.classList.contains('open')) { canvas.width = 0; canvas.height = 0; } }, 250);
    } else {
      panel.classList.add('open');
      openChartVids.add(vid);
      requestAnimationFrame(() => draw(canvas));
    }
  });

  // 開いているグラフ上のホバーで日付・値を表示
  document.addEventListener('mousemove', e => {
    const cv = e.target.closest('.cchart'); if (!cv) return;
    const panel = cv.closest('.card-chart'); if (!panel || !panel.classList.contains('open')) return;
    const vv = store.videos[cv.dataset.vid]; if (!vv || !vv.history || vv.history.length < 2) return;
    const h = vv.history, xmin = h[0].ts, xmax = h[h.length-1].ts;
    const mx = e.clientX - cv.getBoundingClientRect().left;
    const ts = xmin + (mx - OL) / (cv.clientWidth - OL - RAX) * (xmax - xmin);
    draw(cv, ts);
  });
  document.addEventListener('mouseout', e => {
    const cv = e.target.closest('.cchart'); if (!cv) return;
    const panel = cv.closest('.card-chart'); if (panel && panel.classList.contains('open')) draw(cv);
  });

  // リサイズで開いているグラフを再描画
  let rt; window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => {
    document.querySelectorAll('.card-chart.open .cchart').forEach(cv => draw(cv));
  }, 150); });

  // renderMain(カード再生成)後に、開いていたグラフを復元描画
  function redrawOpen() {
    document.querySelectorAll('.card-chart.open .cchart').forEach(cv => draw(cv));
  }
  return { redrawOpen };
})();

function renderMain() {
  const videoIds = Object.keys(store.videos);
  if (!videoIds.length) {
    document.getElementById('mainContent').innerHTML =
      '<div class="status-msg">データがありません。更新ボタンを押してください。</div>';
    return;
  }

  let analyses = videoIds.map(analyzeVideo).filter(Boolean);

  // フィルタ
  if (channelFilter === 'own')      analyses = analyses.filter(a => !a.isExternal);
  else if (channelFilter === 'external') analyses = analyses.filter(a => a.isExternal);
  if (showMarkedOnly) analyses = analyses.filter(a => markedSet.has(a.id));
  // 空白区切りの各語をすべて含むものに絞る
  const terms = searchQuery.trim().split(/\s+/).map(normSearch).filter(Boolean);
  if (terms.length) analyses = analyses.filter(a => {
    const t = normSearch(a.title);
    return terms.every(w => t.includes(w));
  });

  // ソート
  if (sortBy === 'date') {
    analyses.sort((a, b) => new Date(b.publishedAt) - new Date(a.publishedAt));
  } else if (sortBy === 'trend') {
    // 勢い: 直近72h の増加速度（views/日）降順。データ未蓄積は末尾
    analyses.sort((a, b) => (b.growthPerDay ?? -Infinity) - (a.growthPerDay ?? -Infinity));
  } else if (sortBy === 'soon') {
    // セクション分け描画側で各グループ内ソートを行うため、ここでは何もしない
  } else {
    // 再生数モード: 純粋な再生数降順
    analyses.sort((a, b) => b.currentViews - a.currentViews);
  }

  // Stats bar・ツールバー表示
  document.getElementById('toolbar').style.display = 'flex';
  document.getElementById('statApproaching').textContent = analyses.filter(a => a.isApproaching).length;
  document.getElementById('statAchieved').textContent    = analyses.filter(a => a.hasAchievement).length;
  document.getElementById('statTotal').textContent       = analyses.length;
  document.getElementById('statsBar').style.display      = 'flex';

  const content = document.getElementById('mainContent');
  content.innerHTML = '';

  if (sortBy === 'soon') {
    // 到達が近い順: 達成済み(1日以内) と もうすぐ は色付きの島に載せ、その他は通常のグリッド
    const sec = [
      { kind: 'achieved', eyebrow: 'MILESTONE ACHIEVED', label: '節目達成',
        items: analyses.filter(a => a.achievedWithin1Day)
          .sort((a, b) => (b.hasAchievement - a.hasAchievement) || b.currentViews - a.currentViews) },
      { kind: 'soon', eyebrow: 'COMING SOON', label: 'もうすぐ到達',
        items: analyses.filter(a => !a.achievedWithin1Day && a.isApproaching)
          .sort((a, b) => (a.estimatedDays ?? Infinity) - (b.estimatedDays ?? Infinity)) },
      { kind: 'other', label: 'その他',
        items: analyses.filter(a => !a.achievedWithin1Day && !a.isApproaching)
          .sort((a, b) => (a.estimatedDays ?? Infinity) - (b.estimatedDays ?? Infinity)) },
    ];
    sec.forEach(({ kind, eyebrow, label, items }) => {
      if (!items.length) return;
      const g = document.createElement('div');
      g.className = 'grid';
      if (kind === 'other') {
        const hdr = document.createElement('div');
        hdr.className = 'section-header';
        hdr.textContent = label;
        g.appendChild(hdr);
        items.forEach(a => g.appendChild(buildCard(a)));
        content.appendChild(g);
        return;
      }
      const island = document.createElement('section');
      island.className = `island ${kind}`;
      island.innerHTML = `
        <div class="island-head">
          <div><div class="island-eyebrow">${eyebrow}</div><div class="island-title">${label}</div></div>
          <div class="island-count">${items.length}本</div>
        </div>`;
      items.forEach(a => g.appendChild(buildCard(a, true)));
      island.appendChild(g);
      content.appendChild(island);
    });
  } else {
    const g = document.createElement('div');
    g.className = 'grid';
    analyses.forEach(a => g.appendChild(buildCard(a)));
    content.appendChild(g);
  }
  if (!analyses.length) {
    const msg = document.createElement('div');
    msg.className = 'empty-msg';
    msg.textContent = '該当する動画がありません' + (showMarkedOnly ? '（★のみ表示中）' : '');
    content.appendChild(msg);
  }

  cardCharts.redrawOpen();  // 更新をまたいで開いていたグラフを復元

  if (store.lastUpdated) {
    showLastUpdated();
  }
}

// ─── 更新処理 ───────────────────────────────────────────
let refreshTimer = null;

function scheduleRefresh() {
  clearTimeout(refreshTimer);
  refreshTimer = setTimeout(doRefresh, store.settings.refreshMinutes * 60 * 1000);
}

async function doRefresh() {
  if (!store.settings.apiKey) { openSettings(); return; }

  const btn = document.getElementById('refreshBtn');
  btn.disabled = true;
  btn.textContent = '取得中...';

  // 既存データがなければローディング表示
  if (!Object.keys(store.videos).length) {
    document.getElementById('mainContent').innerHTML =
      '<div class="status-msg">動画データを取得中...</div>';
  }

  try {
    await fetchAllVideos();
    renderMain();
    // 通知チェック（更新完了後に達成マイルストーンを確認）
    const allAnalyses = Object.keys(store.videos).map(analyzeVideo).filter(Boolean);
    checkAndNotify(allAnalyses);
  } catch(e) {
    document.getElementById('mainContent').innerHTML =
      `<div class="error-msg">✗ ${escHtml(e.message)}</div>`;
    // エラーでも既存データがあれば表示
    if (Object.keys(store.videos).length) renderMain();
  } finally {
    btn.disabled = false;
    btn.textContent = '更新';
    scheduleRefresh();
  }
}

// ─── 設定 ───────────────────────────────────────────────
function openSettings() {
  document.getElementById('cfgApiKey').value    = store.settings.apiKey || '';
  document.getElementById('cfgChannel').value   = store.settings.channelHandle || 'OtonoseKanade';
  document.getElementById('cfgThreshold').value = store.settings.thresholdDays || 3;
  document.getElementById('cfgInterval').value  = store.settings.refreshMinutes || 30;
  document.getElementById('cfgPinnedUrls').value = '';
  document.getElementById('cfgPlaylistUrl').value = '';
  renderPinnedList();
  renderPlaylistList();
  document.getElementById('settingsModal').classList.add('open');
}

function closeSettings() {
  document.getElementById('settingsModal').classList.remove('open');
}

function saveSettings() {
  store.settings.apiKey         = document.getElementById('cfgApiKey').value.trim();
  store.settings.channelHandle  = document.getElementById('cfgChannel').value.trim() || 'OtonoseKanade';
  store.settings.thresholdDays  = parseInt(document.getElementById('cfgThreshold').value) || 3;
  store.settings.refreshMinutes = parseInt(document.getElementById('cfgInterval').value) || 30;
  saveStore();
  updatePageTitle();
  closeSettings();
  if (store.settings.apiKey) doRefresh();
}

function clearData() {
  if (!confirm('履歴データをすべて削除しますか？\n（設定は保持されます）')) return;
  store.videos = {};
  store.lastUpdated = null;
  store.markedIds = [];
  store.notified  = {};
  markedSet = new Set();
  saveStore();
  closeSettings();
  renderMain();
}

// ─── ピン留め動画・プレイリスト管理 ──────────────────────
function parseVideoIds(text) {
  const ids = new Set();
  const re = /(?:youtu\.be\/|[?&]v=)([a-zA-Z0-9_-]{11})/g;
  let m;
  while ((m = re.exec(text)) !== null) ids.add(m[1]);
  return [...ids];
}

async function addPinnedVideos() {
  if (!store.settings.apiKey) { alert('先にAPIキーを保存してください'); return; }
  const text = document.getElementById('cfgPinnedUrls').value.trim();
  if (!text) return;
  const newIds = parseVideoIds(text);
  if (!newIds.length) { alert('有効なYouTube URLが見つかりませんでした'); return; }

  const existing = new Set(store.pinnedVideoIds || []);
  const toFetch = newIds.filter(id => !existing.has(id));
  if (!toFetch.length) { alert('すべて追加済みです'); return; }

  const btn = document.getElementById('addPinnedBtn');
  btn.disabled = true;
  btn.textContent = '取得中...';
  try {
    const now = Date.now();
    const cutoff7d = now - 7 * 24 * 3600 * 1000;
    for (let i = 0; i < toFetch.length; i += 50) {
      const batch = toFetch.slice(i, i + 50);
      const vRes = await apiGet('videos', {
        part: 'statistics,snippet,contentDetails',
        id: batch.join(',')
      });
      for (const item of (vRes.items || [])) {
        if (item.statistics?.viewCount === undefined) continue;
        const lbc = item.snippet.liveBroadcastContent;
        if (lbc === 'live' || lbc === 'upcoming') continue;
        const dur   = parseDuration(item.contentDetails?.duration || '');
        const views = parseInt(item.statistics.viewCount || '0');
        const thumb = item.snippet.thumbnails.medium?.url || item.snippet.thumbnails.default?.url || '';
        if (!store.videos[item.id]) {
          store.videos[item.id] = {
            title: item.snippet.title,
            thumbnail: thumb,
            publishedAt: item.snippet.publishedAt,
            duration: dur,
            channelId: item.snippet.channelId,
            history: []
          };
        }
        store.videos[item.id].title     = item.snippet.title;
        store.videos[item.id].thumbnail = thumb;
        store.videos[item.id].duration  = dur;
        store.videos[item.id].channelId = item.snippet.channelId;
        const hist = store.videos[item.id].history;
        if (!hist.length || hist[hist.length - 1].views !== views) {
          hist.push({ ts: now, views });
        }
        store.videos[item.id].history = hist.filter(h => h.ts >= cutoff7d);
        existing.add(item.id);
      }
    }
    store.pinnedVideoIds = [...existing];
    saveStore();
    document.getElementById('cfgPinnedUrls').value = '';
    renderPinnedList();
    renderMain();
  } catch(e) {
    alert('取得エラー: ' + e.message);
  } finally {
    btn.disabled = false;
    btn.textContent = '追加して取得';
  }
}

function removePinnedVideo(id) {
  store.pinnedVideoIds = (store.pinnedVideoIds || []).filter(v => v !== id);
  // 他チャンネル動画のみstoreから削除（チャンネル動画は次回更新で復活するため残す）
  const v = store.videos[id];
  const ownCh = store.settings.ownChannelId;
  if (v && ownCh && v.channelId && v.channelId !== ownCh) {
    delete store.videos[id];
  }
  saveStore();
  renderPinnedList();
  renderMain();
}

function parsePlaylistId(text) {
  const m = text.trim().match(/[?&]list=([A-Za-z0-9_-]+)/);
  return m ? m[1] : null;
}

async function addPinnedPlaylist() {
  if (!store.settings.apiKey) { alert('先にAPIキーを保存してください'); return; }
  const text = document.getElementById('cfgPlaylistUrl').value.trim();
  if (!text) return;
  const plId = parsePlaylistId(text);
  if (!plId) { alert('有効なプレイリストURLが見つかりませんでした'); return; }

  const existing = new Set(store.pinnedPlaylistIds || []);
  if (existing.has(plId)) { alert('すでに追加済みのプレイリストです'); return; }

  const btn = document.getElementById('addPlaylistBtn');
  btn.disabled = true; btn.textContent = '確認中...';
  try {
    const plRes = await apiGet('playlists', { part: 'snippet', id: plId });
    if (!plRes.items?.length) {
      alert('プレイリストが見つかりません（非公開またはURLが不正）'); return;
    }
    const title = plRes.items[0].snippet.title;

    // プレイリスト内の動画IDを取得し、手動ピン済みと重複するものをプレイリスト管理に移行
    // （markedIds のスターはそのまま維持）
    btn.textContent = '動画リスト取得中...';
    const plVideoIds = await fetchPlaylistVideoIds(plId);
    const pinnedSet = new Set(store.pinnedVideoIds || []);
    const moved = plVideoIds.filter(id => pinnedSet.has(id));
    if (moved.length) {
      store.pinnedVideoIds = (store.pinnedVideoIds || []).filter(id => !moved.includes(id));
    }

    existing.add(plId);
    store.pinnedPlaylistIds = [...existing];
    if (!store.pinnedPlaylistMeta) store.pinnedPlaylistMeta = {};
    store.pinnedPlaylistMeta[plId] = { title };
    saveStore();
    document.getElementById('cfgPlaylistUrl').value = '';
    renderPinnedList();
    renderPlaylistList();
    const movedMsg = moved.length ? `\n手動追加済みの${moved.length}件をプレイリスト管理に移行しました（スターは維持）。` : '';
    alert(`「${title}」を追加しました。次回更新時に動画が自動で反映されます。${movedMsg}`);
  } catch(e) {
    alert('取得エラー: ' + e.message);
  } finally {
    btn.disabled = false; btn.textContent = 'プレイリストを追加';
  }
}

function removePinnedPlaylist(plId) {
  store.pinnedPlaylistIds = (store.pinnedPlaylistIds || []).filter(id => id !== plId);
  if (store.pinnedPlaylistMeta) delete store.pinnedPlaylistMeta[plId];
  saveStore();
  renderPlaylistList();
}

function renderPlaylistList() {
  const wrap = document.getElementById('playlistListWrap');
  const list = document.getElementById('playlistList');
  if (!wrap || !list) return;
  const ids = store.pinnedPlaylistIds || [];
  if (!ids.length) { wrap.style.display = 'none'; return; }
  wrap.style.display = 'block';
  list.innerHTML = ids.map(plId => {
    const meta  = store.pinnedPlaylistMeta?.[plId];
    const raw   = meta?.title || plId;
    const title = raw.length > 46 ? raw.substring(0, 46) + '…' : raw;
    return `<div class="pinned-item">
      <span class="pinned-title">${escHtml(title)}</span>
      <button class="btn danger" style="font-size:9px;padding:2px 6px;flex-shrink:0"
              onclick="removePinnedPlaylist('${escHtml(plId)}')">削除</button>
    </div>`;
  }).join('');
}

function renderPinnedList() {
  const wrap = document.getElementById('pinnedListWrap');
  const list = document.getElementById('pinnedList');
  if (!wrap || !list) return;
  const ids = store.pinnedVideoIds || [];
  if (!ids.length) { wrap.style.display = 'none'; return; }
  wrap.style.display = 'block';
  list.innerHTML = ids.map(id => {
    const v = store.videos[id];
    const raw = v ? v.title : id;
    const title = raw.length > 46 ? raw.substring(0, 46) + '…' : raw;
    return `<div class="pinned-item">
      <span class="pinned-title">${escHtml(title)}</span>
      <button class="btn danger" style="font-size:9px;padding:2px 6px;flex-shrink:0"
              onclick="removePinnedVideo('${escHtml(id)}')">削除</button>
    </div>`;
  }).join('');
}

document.getElementById('fOwn').classList.toggle('active',      channelFilter === 'own');

document.getElementById('sSoon').classList.toggle('active',   sortBy === 'soon');

if (!IS_PUBLIC_MODE) updatePageTitle(); // 公開モードはfetch完了後に呼ぶ
updateNotifBtn();
updateThemeBtn();

if (IS_PUBLIC_MODE) {
  publicMode = true;
  // 設定ボタン（⚙）のみ非表示
  document.querySelector('.header-right .btn:last-child').style.display = 'none';
  // 自動更新ボタンに差し替え
  const refreshBtn = document.getElementById('refreshBtn');
  refreshBtn.textContent = '⟳';
  refreshBtn.title = '自動更新 OFF（クリックで開始）';
  refreshBtn.onclick = () => togglePublicAutoRefresh();

  // リロード前の通知状態を即時復元（データ取得を待たない）
  if (store.settings.notifEnabled && 'Notification' in window && Notification.permission === 'granted') {
    togglePublicAutoRefresh(true);
  }

  Promise.all([
    fetch('./public_data.json').then(r => { if (!r.ok) throw new Error('public_data.json'); return r.json(); }),
    fetch('./public_config.json').then(r => { if (!r.ok) throw new Error('public_config.json'); return r.json(); }),
  ]).then(([data, cfg]) => {
    store.videos                    = data.videos || {};
    store.settings.ownChannelId     = data.ownChannelId || '';
    store.lastUpdated               = data.lastUpdated  || null;
    store.settings.thresholdDays    = cfg.thresholdDays || 3;
    store.settings.channelHandle    = cfg.channelHandle || store.settings.channelHandle;
    markedSet                       = new Set(cfg.markedIds || []);
    store.pinnedVideoIds            = cfg.pinnedVideoIds || [];
    // 自チャンネルの絞り込みボタンの表示名（例: "奏"）。未設定なら汎用の「自CH」
    if (cfg.ownLabel) document.getElementById('fOwn').textContent = cfg.ownLabel;
    updatePageTitle();
    document.getElementById('toolbar').style.display = 'flex';
    if (store.lastUpdated) {
      showLastUpdated();
    }
    renderMain();
  }).catch(err => {
    document.getElementById('mainContent').innerHTML =
      `<div style="color:var(--load-err);padding:40px;text-align:center">データ読み込みエラー: ${escHtml(err.message)}</div>`;
  });
} else if (!store.settings.apiKey) {
  document.getElementById('mainContent').innerHTML = `
    <div class="setup-screen">
      <div class="setup-box">
        <div class="setup-title">初期設定</div>
        <div class="setup-desc">
          YouTube Data API v3 のキーを入力してください。<br>
          Google Cloud Console で取得できます（無料枠で十分です）。<br>
          キーはこのブラウザの localStorage にのみ保存されます。
        </div>
        <div>
          <div class="field-label">API Key</div>
          <input class="field-input" type="password" id="setupApiKey" placeholder="AIza...">
        </div>
        <button class="btn primary" onclick="applySetup()"
                style="width:100%;padding:10px;font-size:12px">
          保存して開始
        </button>
      </div>
    </div>`;
} else {
  // キャッシュデータがあれば即時表示し、バックグラウンドで更新
  if (Object.keys(store.videos).length) renderMain();
  doRefresh();
}

function applySetup() {
  const key = document.getElementById('setupApiKey')?.value.trim();
  if (!key) return;
  store.settings.apiKey = key;
  saveStore();
  doRefresh();
}

// 1分ごとに再描画してETAを最新に保つ（API呼び出しなし）
setInterval(() => {
  if (Object.keys(store.videos).length) renderMain();
}, 60 * 1000);
